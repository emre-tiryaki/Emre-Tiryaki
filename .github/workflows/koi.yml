name: Update Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Choose random Koi color
        id: color
        run: |
          COLORS=(white black asagi tea gold platinum)
          COLOR=${COLORS[$RANDOM % ${#COLORS[@]}]}
          echo "body=$COLOR" >> "$GITHUB_OUTPUT"
          echo "Today's Koi color: $COLOR"

      - uses: yalongwastaken/git-koi@v1
        with:
          body: ${{ steps.color.outputs.body }}
          output-dir: koi

      - name: Commit Koi if changed
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "Koi is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --quiet --message "koi: update daily animation"
          git push --quiet